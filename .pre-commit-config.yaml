minimum_pre_commit_version: "4.6.2"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: format-check
        name: Check Ruff formatting
        entry: make format-check
        language: system
        pass_filenames: false
        always_run: true

      - id: lint
        name: Run Ruff linting
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true

      - id: typecheck
        name: Run Pyright
        entry: make typecheck
        language: system
        pass_filenames: false
        always_run: true

      - id: unit-tests
        name: Run deterministic unit tests
        entry: make test-unit
        language: system
        pass_filenames: false
        always_run: true
