[project]
name = "knowledge-service"
version = "0.1.0"
description = "Provider-agnostic organizational knowledge service"
readme = "README.md"
authors = [
    { name = "Ivan Verenich", email = "ivanverenich@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["**/*.md"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PTH",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
# pytest tests express expectations with bare asserts.
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-m", "not live"]
markers = [
    "integration: needs a real boundary such as PostgreSQL, Redis, or HTTP",
    "live: calls a real provider or Source and is never on by default",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
timeout = 30

[tool.coverage.run]
source = ["knowledge_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
